<!DOCTYPE html>
<html>

<head>
    <title>Django Login Validation</title>
</head>

<body>
    <h2>User Login Form</h2>

    {% if success %}
    <p style="color: green;">
        Login form validated successfully!
    </p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
</body>

</html>
